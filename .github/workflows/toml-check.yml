name: toml-check

on:
  push:
    branches:
        - '!main'
  pull_request:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
    toml-check:
        runs-on: ubuntu-latest
        steps:
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'
        - uses: actions/checkout@v4
          with:
            path: "base"
            ref: ${{ github.base_ref }}
        - uses: actions/checkout@v4
          with:
            path: "branch"
        - name: Dump GitHub context
          env:
            GITHUB_CONTEXT: ${{ toJson(github) }}
          run: echo "$GITHUB_CONTEXT"
        